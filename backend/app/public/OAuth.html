<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Test Google OAuth</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 480px;
    margin: 80px auto;
    padding: 0 20px;
    color: #222;
  }
  h1 { font-size: 1.2rem; margin-bottom: 24px; }
  button, .btn {
    display: inline-block;
    padding: 10px 18px;
    background: #4285F4;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 0.95rem;
    cursor: pointer;
    text-decoration: none;
  }
  button:hover, .btn:hover { background: #3367D6; }
  pre {
    background: #f5f5f5;
    padding: 14px;
    border-radius: 6px;
    font-size: 0.85rem;
    overflow-x: auto;
    margin-top: 20px;
  }
  .status { margin-top: 16px; font-size: 0.9rem; }
  .ok { color: #1a7f37; }
  .err { color: #c0392b; }
</style>
</head>
<body>

  <h1>Test flusso Google OAuth</h1>

  <!-- Cambia questo se il backend gira su un host/porta diverso -->
  <script>const API_BASE = "";</script>

  <a class="btn" id="loginBtn" href="">Login con Google</a>

  <div class="status" id="status"></div>
  <pre id="output" style="display:none;"></pre>

  <script>
    // Costruisce il link di login: navigazione vera, NON fetch
    document.getElementById('loginBtn').href = API_BASE + "/auth/google_login";

    // Endpoint da adattare al tuo backend: qui ci si aspetta
    // un endpoint protetto da checkJwt che restituisce l'utente corrente
    // (es. GET /auth/me, leggendo il JWT dal cookie HttpOnly)
    async function checkAuth() {
      const statusEl = document.getElementById('status');
      const outputEl = document.getElementById('output');
      try {
        const res = await fetch(API_BASE + "/auth/me", {
          method: "GET",
          credentials: "include" // fondamentale per inviare i cookie HttpOnly
        });

        if (res.ok) {
          const data = await res.json();
          statusEl.textContent = "✅ Autenticato";
          statusEl.className = "status ok";
          outputEl.style.display = "block";
          outputEl.textContent = JSON.stringify(data, null, 2);
        } else {
          statusEl.textContent = "Non autenticato (status " + res.status + ")";
          statusEl.className = "status err";
        }
      } catch (err) {
        statusEl.textContent = "Errore di rete: " + err.message;
        statusEl.className = "status err";
      }
    }

    checkAuth();
  </script>

</body>
</html>
