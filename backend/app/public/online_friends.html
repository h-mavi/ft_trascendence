<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <title>Notifiche</title>
    <style>
      body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
      h2 { margin-bottom: 12px; }
      #notifications { list-style: none; padding: 0; }
      #notifications li { background: #f1f5f9; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
      #notifications li strong { display: block; font-size: 16px; }
      #notifications li span { font-size: 13px; color: #555; }
      #notifications li p { margin: 6px 0 0; font-size: 14px; }
      #login-section input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
      label { display: block; margin-top: 12px; font-weight: bold; }
      button { margin-top: 16px; padding: 10px 24px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; }
      button:hover { background: #2563eb; }
      #main-section { display: none; }
      #login-feedback { margin-top: 8px; color: red; }
      .dot {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #ef4444;
        margin-right: 8px;
        vertical-align: middle;
        box-shadow: 0 0 4px rgba(0,0,0,0.2);
        transition: background 0.3s;
      }
      .dot.online {
        background: #22c55e;
        box-shadow: 0 0 6px #22c55e88;
      }
  </style>
  </head>
  <body>

    <div id="login-section">
      <h2>Login</h2>
      <label>Username</label>
      <input type="text" id="username" placeholder="username" />
      <label>Password</label>
      <input type="password" id="password" placeholder="password" />
      <button onclick="login()">Login</button>
      <div id="login-feedback"></div>
    </div>

    <div id="main-section">
      <h2>Amici</h2>
      <ul id="friends-list"></ul>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
    let socket = null;

    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const feedback = document.getElementById('login-feedback');

      if (!username || !password) {
        feedback.textContent = 'Compila username e password.';
        return;
      }

      const res = await fetch('http://localhost:8080/auth/login', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      if (!res.ok) {
        feedback.textContent = 'Login fallito. Controlla le credenziali.';
        return;
      }

      const meRes = await fetch('http://localhost:8080/api/users/me', {
        credentials: 'include'
      });
      const me = await meRes.json();
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('main-section').style.display = 'block';

      // carica notifiche esistenti
      const friends = await fetch('http://localhost:8080/api/friends', {
        credentials: 'include'
      });
      const friendsData = await friends.json();
      const friendsList = document.getElementById('friends-list');

      for (const f of friendsData.data.friendship) {
        // determina quale dei due utenti è l'amico (non sei tu)
        const friend = f.friend;
        console.log(friend);

        const li = document.createElement('li');
        li.id = `friend-${friend.id_user}`;
        li.innerHTML = `
          <span class="dot" id="dot-${friend.id_user}"></span>
          ${friend.username}
        `;
        friendsList.appendChild(li);
      }

      socket = io();
      socket.on('connect', () => {console.log("Utente connesso: ", socket.id)} )
      // Ascolta gli eventi di presenza
      socket.on('friend:online', ({ userId }) => {
        const dot = document.getElementById(`dot-${userId}`);
        if (dot) dot.classList.add('online');
      });

      socket.on('friend:offline', ({ userId }) => {
        const dot = document.getElementById(`dot-${userId}`);
        if (dot) dot.classList.remove('online');
      });
    }
  </script>
  </body>
</html>
